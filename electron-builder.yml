appId: com.maqswarm.cognitience-ss
productName: Cognitience SS
copyright: Copyright © 2026 Maq-Swarm

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  installerHeaderIcon: resources/icon.png
  shortcutName: Cognitience SS

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64

publish:
  provider: github
  owner: Maq-Swarm
  repo: cognitience-ss
