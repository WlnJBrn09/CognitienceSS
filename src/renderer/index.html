<!DOCTYPE html>
<html lang="en" data-theme="cognitience-light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitience SS</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/grid.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- ─── Title Bar ──────────────────────────────────── -->
  <div id="title-bar">
    <div class="title-bar-left">
      <div class="app-logo">
        <img src="assets/logo.png" alt="Cognitience SS" class="logo-img" />
      </div>
      <span class="app-name">Cognitience SS</span>
    </div>
    <div class="title-bar-center">
      <span id="doc-title">Untitled — Cognitience SS</span>
    </div>
    <div class="title-bar-right">
      <button id="btn-command-palette" class="title-bar-btn" title="Command Palette (Ctrl+Shift+P)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
      </button>
      <div class="window-controls">
        <button class="window-btn window-minimize" id="btn-minimize" title="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1" fill="currentColor"/></svg>
        </button>
        <button class="window-btn window-maximize" id="btn-maximize" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="window-btn window-close" id="btn-close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ─── Formatting Toolbar ─────────────────────────── -->
  <div id="editor-toolbar">
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="new-file" title="New File (Ctrl+N)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      </button>
      <button class="tool-btn" data-cmd="open-file" title="Open File (Ctrl+O)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="tool-btn" data-cmd="open-folder" title="Open Folder">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      </button>
      <button class="tool-btn" data-cmd="save-file" title="Save (Ctrl+S)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="undo" title="Undo (Ctrl+Z)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="tool-btn" data-cmd="redo" title="Redo (Ctrl+Y)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <select class="tool-select" id="font-family-select" title="Font Family">
        <option value="Segoe UI">Segoe UI</option>
        <option value="Arial">Arial</option>
        <option value="Calibri">Calibri</option>
        <option value="Consolas">Consolas</option>
        <option value="Courier New">Courier New</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Verdana">Verdana</option>
      </select>
      <input type="number" class="tool-number" id="font-size-input" title="Font Size" value="12" min="6" max="72" step="1" />
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="bold" title="Bold (Ctrl+B)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
      </button>
      <button class="tool-btn" data-cmd="italic" title="Italic (Ctrl+I)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button class="tool-btn" data-cmd="underline" title="Underline (Ctrl+U)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
      </button>
      <button class="tool-btn" data-cmd="strikethrough" title="Strikethrough">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/><path d="M16 6a4 4 0 0 0-4-3H9a3 3 0 0 0-3 3"/><path d="M8 18a4 4 0 0 0 4 3h3a3 3 0 0 0 3-3"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <div class="color-picker-wrapper">
        <button class="tool-btn color-btn" id="text-color-btn" title="Text Color">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
          <span class="color-bar" id="text-color-bar" style="background:#1e1e2e"></span>
        </button>
        <input type="color" class="tool-color-hidden" id="text-color" value="#1e1e2e" />
      </div>
      <div class="color-picker-wrapper">
        <button class="tool-btn color-btn" id="bg-color-btn" title="Cell Background">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9 4z"/><path d="M3 7v6l9 4 9-4V7"/></svg>
          <span class="color-bar" id="bg-color-bar" style="background:#ffffff"></span>
        </button>
        <input type="color" class="tool-color-hidden" id="bg-color" value="#ffffff" />
      </div>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="align-left" title="Align Left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
      </button>
      <button class="tool-btn" data-cmd="align-center" title="Align Center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
      </button>
      <button class="tool-btn" data-cmd="align-right" title="Align Right">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="format-currency" title="Currency Format">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </button>
      <button class="tool-btn" data-cmd="format-percent" title="Percent Format">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
      </button>
      <button class="tool-btn" data-cmd="format-number" title="Number Format">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="insert-row" title="Insert Row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>
      <button class="tool-btn" data-cmd="insert-col" title="Insert Column">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
      </button>
      <button class="tool-btn" data-cmd="merge-cells" title="Merge Cells">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-cmd="sort-asc" title="Sort A→Z">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/><path d="M18 9l3 3-3 3"/></svg>
      </button>
      <button class="tool-btn" data-cmd="sort-desc" title="Sort Z→A">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/><path d="M18 15l3-3-3-3"/></svg>
      </button>
      <button class="tool-btn" data-cmd="filter" title="Filter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button class="tool-btn" id="btn-toggle-sidebar" title="Toggle Sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <button class="tool-btn" id="btn-toggle-right-panel" title="Toggle Properties">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
    </div>
  </div>

  <!-- ─── Formula Bar ────────────────────────────────── -->
  <div id="formula-bar">
    <input type="text" class="cell-address" id="cell-address" value="A1" readonly />
    <div class="formula-bar-label" title="Formula">fx</div>
    <input type="text" class="formula-bar-input" id="formula-input" placeholder="Enter value or formula…" />
  </div>

  <!-- ─── Main Container ─────────────────────────────── -->
  <div id="main-container">
    <!-- ── Left Sidebar (Sheets / Named Ranges) ── -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span id="sidebar-title">Sheets</span>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- ── Grid Area ── -->
    <div id="grid-area">
      <div class="grid-viewport" id="grid-viewport">
        <table class="grid-table" id="grid-table">
          <!-- Built dynamically by renderer.js -->
        </table>
      </div>
    </div>

    <!-- ── Right Panel (Cell Properties / Outline like WP) ── -->
    <div id="right-panel" class="hidden">
      <div class="panel-header">
        <span>Properties</span>
        <button class="panel-close" id="close-right-panel">×</button>
      </div>
      <div class="panel-body" id="right-panel-body">
        <div class="properties-section">
          <div class="properties-section-title">Cell Info</div>
          <div class="properties-row">
            <span class="properties-label">Address</span>
            <span class="properties-value" id="prop-cell-addr">A1</span>
          </div>
          <div class="properties-row">
            <span class="properties-label">Value</span>
            <span class="properties-value" id="prop-cell-value">—</span>
          </div>
          <div class="properties-row">
            <span class="properties-label">Format</span>
            <span class="properties-value" id="prop-cell-format">General</span>
          </div>
        </div>
        <div class="properties-section">
          <div class="properties-section-title">Selection</div>
          <div class="properties-row">
            <span class="properties-label">Range</span>
            <span class="properties-value" id="prop-selection-range">A1</span>
          </div>
          <div class="properties-row">
            <span class="properties-label">Count</span>
            <span class="properties-value" id="prop-selection-count">1</span>
          </div>
          <div class="properties-row">
            <span class="properties-label">Sum</span>
            <span class="properties-value" id="prop-selection-sum">—</span>
          </div>
          <div class="properties-row">
            <span class="properties-label">Average</span>
            <span class="properties-value" id="prop-selection-avg">—</span>
          </div>
        </div>
        <div class="properties-section">
          <div class="properties-section-title">Recent Spreadsheets</div>
          <div id="recent-sheets-list" class="recent-list">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Sheet Tabs ─────────────────────────────────── -->
  <div id="sheet-tabs">
    <button class="sheet-tab-add" id="btn-add-sheet" title="Add Sheet">+</button>
    <div class="sheet-tabs-scroll" id="sheet-tabs-scroll">
      <!-- Tabs built dynamically with close buttons -->
    </div>
  </div>

  <!-- ─── Status Bar ─────────────────────────────────── -->
  <div id="status-bar">
    <div class="status-bar-left">
      <span class="status-item" id="status-cell-info">A1</span>
      <span class="status-item" id="status-save-state"></span>
    </div>
    <div class="status-bar-right">
      <span class="status-item" id="status-sum"></span>
      <span class="status-item" id="status-avg"></span>
      <span class="status-item" id="status-count">0 cells</span>
      <span class="status-item" id="status-format">General</span>
      <span class="status-item" id="status-theme">Cognitience Light</span>
      <div class="zoom-controls">
        <button id="zoom-out" title="Zoom Out">−</button>
        <input type="range" class="zoom-slider" id="zoom-slider" min="25" max="200" value="100" />
        <button id="zoom-in" title="Zoom In">+</button>
        <span class="status-item" id="zoom-level">100%</span>
      </div>
    </div>
  </div>

  <!-- ─── Command Palette ────────────────────────────── -->
  <div id="command-palette" class="hidden">
    <div class="palette-overlay" id="palette-overlay"></div>
    <div class="palette-box">
      <input type="text" id="palette-input" placeholder="Type a command…" autocomplete="off" />
      <div id="palette-results"></div>
    </div>
  </div>

  <!-- ─── Notification Container ──────────────────────── -->
  <div id="notification-container"></div>

  <!-- ─── Context Menu ────────────────────────────────── -->
  <div id="context-menu" class="hidden"></div>

  <!-- ─── Scripts ────────────────────────────────────── -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
